# FlashDrop · Cloudflare Workers 配置
# ---------------------------------------------------------------------------
# 部署前只需要改一处：把下面的 name 换成你想要的项目名（会出现在
# <name>.<你的账号>.workers.dev 里，绑自定义域名后就不重要了）。
#
# 其余项照抄即可。TURN 相关的三项是 secret，**不要写在这个文件里**，
# 用 `npx wrangler secret put` 单独注入（见 README）。

name = "flashdrop"
main = "src/index.js"
compatibility_date = "2026-09-01"

# ---------------------------- 自定义域名 ----------------------------
# 6.中国 的 punycode 写法就是 6.xn--fiqs8s（wrangler 里必须写 ASCII 形式）。
# custom_domain = true 表示由 Cloudflare 自动签发证书 + 建 DNS 记录，
# 不需要手动去 DNS 面板加 CNAME —— 面板上那几条「缺少 A / CNAME / MX」的
# 扫描提示对 Worker 站点是误报，**一律忽略，不要手动补**。
#
# 为什么是四条而不是两条：
#   ① www 必须单独列：DNS 里没有「自动补 www」这回事，www.6.中国 是个
#      三级域名，跟 6.中国 是两个完全不同的名字，不显式绑定就一直 ENOTFOUND。
#   ② 繁体 6.中國 也必须单独列：.中國(xn--fiqz9s) 和 .中国(xn--fiqs8s)
#      是**两个不同的顶级域**，CNNIC 那边简繁共用一份注册数据（所以 NS 一起改了），
#      但在 Cloudflare 是各自独立的 zone，DNS 层面互不相认。
#      前端 www-redirect.js 会把繁体写法归一到简体，保证设备名/配对记忆只有一份。
routes = [
  { pattern = "6.xn--fiqs8s",     custom_domain = true },  # 6.中国
  { pattern = "www.6.xn--fiqs8s", custom_domain = true },  # www.6.中国
  { pattern = "6.xn--fiqz9s",     custom_domain = true },  # 6.中國（繁体）
  { pattern = "www.6.xn--fiqz9s", custom_domain = true }   # www.6.中國（繁体）
]

# 保留 *.workers.dev 备用入口（海外可直连；大陆被 DNS 污染，走不通，
# 所以它只是「兜底 + 验证」用，主入口始终是 6.中国）。
workers_dev = true

# 静态资源直接从 ../public 取，和本地 Node 版共用同一份前端，避免两套代码漂移
[assets]
directory = "../public"
binding = "ASSETS"
# 不做 SPA fallback：找不到就是 404，避免把 /ws 之类的路径错误地回成 index.html
not_found_handling = "none"

# ---------------------------- Durable Objects ----------------------------

[[durable_objects.bindings]]
name = "SIGNAL"
class_name = "SignalRoom"

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "TurnBudget"

[[migrations]]
tag = "v1"
# 免费计划只支持 SQLite 后端的 DO（这是硬性要求，写成 new_classes 会部署失败）
new_sqlite_classes = ["SignalRoom", "TurnBudget"]

# ------------------------------- 变量 -------------------------------
# 这些不是机密，直接写在这里；机密的 TURN key 用 wrangler secret 注入。

[vars]
# WS 中继兜底：P2P 和 TURN 都打不通时，退化成服务器转发（慢，但一定能通）
WS_RELAY = "on"

# 公网自动发现策略（2026-10-06 改为 "off"：安全优先）：
#   "off" = 不做自动发现，只能靠二维码 / 房间码 / 配对码配对   ← 当前选择
#   "ip"  = 按出口 IP 分房（同一个路由器下的设备互相可见）
#
# 为什么选 "off"：国内运营商（尤其中国移动 4G/5G）大量使用 CGNAT，
# 成千上万个陌生用户会共享同一个出口 IP。选 "ip" 意味着这些人会被放进
# 同一间房、互相看见设备名 —— 对一个匿名传输站点来说这是不能接受的。
#
# ⚠ 代价（必须知道）：Cloudflare 侧看到的是**客户端公网出口 IP**，
#   所以 "off" 之后**连同一个 Wi-Fi 下的两台设备也发现不了彼此**，
#   不是「只影响跨网络」。所有配对都必须走二维码 / 房间码 / 配对码。
#   （本地 Node 版不受影响：它直连内网，服务端看到的是私网 IP，
#     私网 /24 分房不经过这个开关，局域网自动发现照常可用。）
WAN_ROOM_MODE = "off"

# 每月 TURN 额度闸门（GB）。Cloudflare 免费额度是 1000 GB，留余量。
TURN_MONTHLY_BUDGET_GB = "900"

# ------------------------------ 可观测性 ------------------------------

[observability]
enabled = true
